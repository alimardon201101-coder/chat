<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Maxfiy Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex items-center justify-center">

  <!-- Parol tekshiruv oynasi -->
  <div id="loginBox" class="bg-slate-900 p-8 rounded-2xl w-96 border border-slate-800 shadow-2xl">
    <h2 class="text-xl font-bold mb-4 text-red-500">Maxfiy Hudud</h2>
    <input type="password" id="adminPassword" placeholder="Admin parolini kiriting..." class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl mb-4 focus:outline-none focus:border-red-500">
    <button onclick="checkAdminPassword()" class="w-full bg-red-600 hover:bg-red-500 transition py-3 rounded-xl font-bold">Kirish</button>
  </div>

  <!-- Admin Panel Asosiy Qismi -->
  <div id="adminPanel" class="hidden w-full max-w-4xl p-8 bg-slate-900 rounded-2xl border border-slate-800">
    <h1 class="text-2xl font-bold mb-6 text-indigo-400">Admin Boshqaruv Paneli</h1>
    <div class="grid grid-cols-2 gap-6">
      <div class="bg-slate-950 p-6 rounded-xl border border-slate-800">
        <h3 class="font-bold text-lg mb-2">Tizimdagi O'quvchilar</h3>
        <ul id="userListAdmin" class="space-y-2 text-sm text-slate-300"></ul>
      </div>
      <div class="bg-slate-950 p-6 rounded-xl border border-slate-800">
        <h3 class="font-bold text-lg mb-2">Tezkor Buyruqlar</h3>
        <p class="text-sm text-slate-400 mb-4">Bu yerdan barcha xabarlarni boshqarishingiz yoki yangi o'quvchi qo'shishingiz mumkin.</p>
        <button onclick="location.href='index.html'" class="bg-indigo-600 px-4 py-2 rounded-lg text-sm font-bold">Chatga O'tish</button>
      </div>
    </div>
  </div>

  <script>
    function checkAdminPassword() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'f7f420252026') {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadAdminData();
      } else {
        alert("Parol noto'g'ri!");
      }
    }

    async function loadAdminData() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const list = document.getElementById('userListAdmin');
      list.innerHTML = '';
      users.forEach(u => {
        list.innerHTML += `<li class="flex justify-between border-b border-slate-800 pb-2"><span>${u.username}</span> <span class="text-indigo-400">${u.role}</span></li>`;
      });
    }
  </script>
</body>
</html>
